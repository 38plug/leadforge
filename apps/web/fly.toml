# Fly.io configuration for the LeadForge frontend.
#
# NEXT_PUBLIC_API_URL is a build-time argument: Next.js inlines NEXT_PUBLIC_*
# values into the client bundle at build time, so it cannot be set as a
# runtime secret. Deploy the API first, then point this at its URL — and
# redeploy the frontend whenever that URL changes.

app = "leadforge-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_API_URL = "https://leadforge-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
