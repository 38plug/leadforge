<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Home-screen icon for iOS. Square-cornered on purpose: iOS applies its
    own rounded mask, and a radius here would be clipped twice.

    Standalone rather than rendered from the LogoMark
    component: this file is requested directly by the browser, so it carries
    its own tile and cannot depend on React or on CSS variables.

    The arcs are thicker and the highlight brighter than the in-app mark -
    at 16px the subtleties disappear and only contrast survives.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12141B"/>
      <stop offset="100%" stop-color="#0B0C11"/>
    </linearGradient>
    <linearGradient id="body" x1="20" y1="14" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="0" fill="url(#tile)"/>
  <circle cx="50" cy="50" r="30" fill="url(#bloom)" filter="url(#soft)"/>

  <g transform="rotate(-24 50 34)">
    <circle cx="50" cy="34" r="19" fill="none" stroke="#8B5CF6" stroke-width="12"
            stroke-dasharray="81.2 38.2" stroke-linecap="round" filter="url(#soft)" opacity="0.8"/>
    <circle cx="50" cy="34" r="19" fill="none" stroke="url(#body)" stroke-width="11"
            stroke-dasharray="81.2 38.2" stroke-linecap="round"/>
    <circle cx="50" cy="34" r="19" fill="none" stroke="#D9F99D" stroke-width="4"
            stroke-dasharray="20.3 99.1" stroke-dashoffset="-9.6" stroke-linecap="round"/>
  </g>

  <g transform="rotate(156 50 66)">
    <circle cx="50" cy="66" r="19" fill="none" stroke="#8B5CF6" stroke-width="12"
            stroke-dasharray="81.2 38.2" stroke-linecap="round" filter="url(#soft)" opacity="0.8"/>
    <circle cx="50" cy="66" r="19" fill="none" stroke="url(#body)" stroke-width="11"
            stroke-dasharray="81.2 38.2" stroke-linecap="round"/>
    <circle cx="50" cy="66" r="19" fill="none" stroke="#D9F99D" stroke-width="4"
            stroke-dasharray="20.3 99.1" stroke-dashoffset="-9.6" stroke-linecap="round"/>
  </g>
</svg>
