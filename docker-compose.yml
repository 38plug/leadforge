services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: leadforge
      POSTGRES_DB: leadforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://leadforge:leadforge@postgres:5432/leadforge
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Real business data, free and worldwide. ENVIRONMENT=production above
      # refuses BUSINESS_PROVIDER=mock outright, so no deployment can ever
      # serve fabricated leads.
      BUSINESS_PROVIDER: ${BUSINESS_PROVIDER:-osm}
      OSM_CONTACT: ${OSM_CONTACT:-}
      # Real AI output when a key is set; a rule-based fallback when it isn't.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      # Outreach sends for real once SMTP credentials are supplied.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-outreach@leadforge.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://leadforge:leadforge@postgres:5432/leadforge
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
